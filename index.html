<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Simple Editor">
  <title>Simple Editor</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=1">
  <link rel="shortcut icon" type="image/png" href="./favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=1">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=1">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08080a}
    #editorFrame{display:block;width:100%;height:100%;border:0;background:#08080a}
  </style>
</head>
<body>
  <iframe id="editorFrame" src="./editor.html" title="Simple Editor"></iframe>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }

    const frame = document.getElementById('editorFrame');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc || doc.getElementById('simple-editor-enhancements')) return;

      const style = doc.createElement('style');
      style.id = 'simple-editor-enhancements';
      style.textContent = `
        .upload-card.dragging { border-color:#60a5fa !important; background:rgba(37,99,235,.08); }
        @media (max-width:720px){
          .top-actions{top:max(8px,env(safe-area-inset-top));left:8px;right:8px}
          .drawer{padding-left:10px;padding-right:10px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
          .drawer-tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
          .drawer-tabs::-webkit-scrollbar{display:none}
          .tab-trigger{flex:0 0 auto;min-width:74px;padding-left:8px;padding-right:8px}
          .options-grid{grid-template-columns:repeat(2,1fr)}
          .panel-block-row{flex-wrap:wrap}
          .canvas-space{padding:12px;padding-bottom:56px}
        }
      `;
      doc.head.appendChild(style);

      const script = doc.createElement('script');
      script.textContent = `
        (() => {
          function loadImageFile(file) {
            if (!file || !file.type || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = event => {
              nativeImg = new Image();
              nativeImg.onload = () => {
                setupImageMaster(nativeImg);
                uploadScreen.style.display = 'none';
                drawer.classList.add('expanded');
              };
              nativeImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
          }

          const uploadCard = document.querySelector('.upload-card');
          ['dragenter','dragover'].forEach(type => window.addEventListener(type, e => {
            e.preventDefault();
            if (uploadCard) uploadCard.classList.add('dragging');
          }));
          ['dragleave','drop'].forEach(type => window.addEventListener(type, e => {
            e.preventDefault();
            if (uploadCard) uploadCard.classList.remove('dragging');
          }));
          window.addEventListener('drop', e => {
            const file = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
            if (file) loadImageFile(file);
          });

          pushHistory = function() {
            redoStack = [];
            const pixels = workingCanvas.width * workingCanvas.height;
            const maxHistory = pixels > 12000000 ? 5 : pixels > 6000000 ? 10 : 20;
            if (undoStack.length >= maxHistory) undoStack.shift();
            undoStack.push(workingCanvas.toDataURL('image/png'));
            updateHistoryButtons();
          };

          const heavyFilters = new Set(['blur','sharpen','edges','emboss']);
          document.getElementById('tab-filters')?.addEventListener('click', e => {
            const card = e.target.closest('[data-filter]');
            if (!card || !heavyFilters.has(card.dataset.filter)) return;
            const pixels = workingCanvas.width * workingCanvas.height;
            if (pixels > 8000000 && !confirm('This filter can be slow on a large photo. Continue?')) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }, true);

          function colorMatch(data, idx, r, g, b, limitSq) {
            if (data[idx + 3] === 0) return false;
            const dr = data[idx] - r, dg = data[idx + 1] - g, db = data[idx + 2] - b;
            return dr*dr + dg*dg + db*db <= limitSq;
          }

          canvas.addEventListener('click', e => {
            if (!isWandToolActive || !workingCanvas.width) return;
            e.preventDefault();
            e.stopImmediatePropagation();

            const rect = canvas.getBoundingClientRect();
            const scaleX = workingCanvas.width / rect.width;
            const scaleY = workingCanvas.height / rect.height;
            const sx = Math.max(0, Math.min(workingCanvas.width - 1, Math.floor((e.clientX - rect.left) * scaleX)));
            const sy = Math.max(0, Math.min(workingCanvas.height - 1, Math.floor((e.clientY - rect.top) * scaleY)));

            const imgData = workingCtx.getImageData(0, 0, workingCanvas.width, workingCanvas.height);
            const data = imgData.data;
            const w = workingCanvas.width, h = workingCanvas.height;
            const start = (sy * w + sx) * 4;
            if (data[start + 3] === 0) return;

            const tr = data[start], tg = data[start + 1], tb = data[start + 2];
            const tolerance = parseInt(document.getElementById('wandTolerance').value, 10) || 20;
            const limitSq = Math.pow(tolerance * 1.73, 2);
            const stack = [[sx, sy]];

            while (stack.length) {
              const [seedX, y] = stack.pop();
              if (y < 0 || y >= h) continue;
              let x = seedX;
              let idx = (y * w + x) * 4;
              while (x >= 0 && colorMatch(data, idx, tr, tg, tb, limitSq)) { x--; idx -= 4; }
              x++;

              let spanUp = false, spanDown = false;
              for (; x < w; x++) {
                idx = (y * w + x) * 4;
                if (!colorMatch(data, idx, tr, tg, tb, limitSq)) break;
                data[idx + 3] = 0;

                if (y > 0) {
                  const up = ((y - 1) * w + x) * 4;
                  const matchUp = colorMatch(data, up, tr, tg, tb, limitSq);
                  if (matchUp && !spanUp) { stack.push([x, y - 1]); spanUp = true; }
                  else if (!matchUp) spanUp = false;
                }
                if (y < h - 1) {
                  const down = ((y + 1) * w + x) * 4;
                  const matchDown = colorMatch(data, down, tr, tg, tb, limitSq);
                  if (matchDown && !spanDown) { stack.push([x, y + 1]); spanDown = true; }
                  else if (!matchDown) spanDown = false;
                }
              }
            }

            workingCtx.putImageData(imgData, 0, 0);
            pushHistory();
            renderWorkspaceView();
          }, true);

          executeCreativeFXMath = function() {
            if (!filterSnapshot) return;
            workingCtx.putImageData(filterSnapshot, 0, 0);
            const imgData = workingCtx.getImageData(0, 0, workingCanvas.width, workingCanvas.height);
            const d = imgData.data;

            if (currentActiveEffect === 'dramatic') {
              for (let i = 0; i < d.length; i += 4) {
                const r = d[i], g = d[i+1], b = d[i+2];
                let nr = (r - 128) * 1.38 + 128;
                let ng = (g - 128) * 1.34 + 128;
                let nb = (b - 128) * 1.42 + 128;
                const lum = 0.2126*r + 0.7152*g + 0.0722*b;
                const shadow = Math.max(0, (120 - lum) / 120);
                nr -= 22 * shadow;
                ng -= 17 * shadow;
                nb -= 8 * shadow;
                nb += 8;
                d[i] = Math.max(0, Math.min(255, nr));
                d[i+1] = Math.max(0, Math.min(255, ng));
                d[i+2] = Math.max(0, Math.min(255, nb));
              }
            } else if (currentActiveEffect === 'comic') {
              const w = imgData.width, h = imgData.height;
              const src = new Uint8ClampedArray(d);
              const gray = new Uint8ClampedArray(w * h);
              for (let p = 0, i = 0; i < src.length; i += 4, p++) {
                gray[p] = 0.299*src[i] + 0.587*src[i+1] + 0.114*src[i+2];
              }
              for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                  const p = y*w + x;
                  const i = p*4;
                  const q = v => Math.min(255, Math.round(v / 64) * 64);
                  let r = q(src[i]), g = q(src[i+1]), b = q(src[i+2]);
                  if (x > 0 && y > 0 && x < w-1 && y < h-1) {
                    const gx = -gray[(y-1)*w+x-1] - 2*gray[y*w+x-1] - gray[(y+1)*w+x-1]
                               + gray[(y-1)*w+x+1] + 2*gray[y*w+x+1] + gray[(y+1)*w+x+1];
                    const gy = -gray[(y-1)*w+x-1] - 2*gray[(y-1)*w+x] - gray[(y-1)*w+x+1]
                               + gray[(y+1)*w+x-1] + 2*gray[(y+1)*w+x] + gray[(y+1)*w+x+1];
                    const edge = Math.sqrt(gx*gx + gy*gy);
                    if (edge > 150) r = g = b = 20;
                    else {
                      const satBoost = 1.15;
                      const avg = (r+g+b)/3;
                      r = avg + (r-avg)*satBoost;
                      g = avg + (g-avg)*satBoost;
                      b = avg + (b-avg)*satBoost;
                    }
                  }
                  d[i] = Math.max(0, Math.min(255, r));
                  d[i+1] = Math.max(0, Math.min(255, g));
                  d[i+2] = Math.max(0, Math.min(255, b));
                }
              }
            } else if (currentActiveEffect === 'infrared') {
              for (let i = 0; i < d.length; i += 4) {
                const r = d[i], g = d[i+1], b = d[i+2];
                const lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
                let nr, ng, nb;
                if (lum < 0.33) {
                  const t = lum / 0.33;
                  nr = 55 + 145*t;
                  ng = 0 + 35*t;
                  nb = 110 + 110*t;
                } else if (lum < 0.66) {
                  const t = (lum - 0.33) / 0.33;
                  nr = 200 + 55*t;
                  ng = 35 + 125*t;
                  nb = 220 - 190*t;
                } else {
                  const t = (lum - 0.66) / 0.34;
                  nr = 255;
                  ng = 160 + 95*t;
                  nb = 30 + 205*t;
                }
                const channelBias = (r - b) * 0.12;
                d[i] = Math.max(0, Math.min(255, nr + channelBias));
                d[i+1] = Math.max(0, Math.min(255, ng));
                d[i+2] = Math.max(0, Math.min(255, nb - channelBias));
              }
            } else {
              if (currentActiveEffect === 'vintage') {
                for (let i = 0; i < d.length; i += 4) {
                  let r = d[i], g = d[i+1], b = d[i+2];
                  d[i] = (r * 0.393) + (g * 0.769) + (b * 0.189) + 15;
                  d[i+1] = (r * 0.349) + (g * 0.686) + (b * 0.168);
                  d[i+2] = (r * 0.272) + (g * 0.534) + (b * 0.131) - 10;
                }
              } else if(currentActiveEffect === 'cyberpunk') {
                for (let i = 0; i < d.length; i += 4) {
                  d[i] = d[i] > 100 ? 255 : d[i] + 30;
                  d[i+1] = d[i+1] * 0.4;
                  d[i+2] = d[i+2] > 100 ? 255 : d[i+2] + 70;
                }
              } else if(currentActiveEffect === 'polaroid') {
                for (let i = 0; i < d.length; i += 4) {
                  d[i] = d[i]*0.88 + 20; d[i+1] = d[i+1]*0.88 + 15; d[i+2] = d[i+2]*0.75;
                }
              } else if(currentActiveEffect === 'fade') {
                for (let i = 0; i < d.length; i += 4) {
                  d[i] = d[i]*0.75 + 35; d[i+1] = d[i+1]*0.75 + 35; d[i+2] = d[i+2]*0.75 + 45;
                }
              } else if(currentActiveEffect === 'solarize') {
                for (let i = 0; i < d.length; i += 4) {
                  d[i] = d[i] > 127 ? 255 - d[i] : d[i];
                  d[i+1] = d[i+1] > 127 ? 255 - d[i+1] : d[i+1];
                  d[i+2] = d[i+2] > 127 ? 255 - d[i+2] : d[i+2];
                }
              } else if(currentActiveEffect === 'posterize') {
                for (let i = 0; i < d.length; i += 4) {
                  d[i] = Math.floor(d[i] / 64) * 64;
                  d[i+1] = Math.floor(d[i+1] / 64) * 64;
                  d[i+2] = Math.floor(d[i+2] / 64) * 64;
                }
              } else if(currentActiveEffect === 'monochrome') {
                for (let i = 0; i < d.length; i += 4) {
                  let v = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
                  let c = v > 115 ? 255 : 20;
                  d[i] = d[i+1] = d[i+2] = c;
                }
              }
            }

            workingCtx.putImageData(imgData, 0, 0);
            renderWorkspaceView();
          };
        })();
      `;
      doc.body.appendChild(script);
    });
  </script>
</body>
</html>
